# Technical Dark: the Technical theme for dark surroundings. Sans-serif
# text, a wider measure for code-heavy pages, and numbered headings.

[meta]
name = "Technical Dark"
author = "Scrald"
schema = 1
appearance = "dark"

[colors]
background    = "#0d1117"
foreground    = "#e6edf3"
muted         = "#9198a1"
accent        = "#4493f8"
link          = "#4493f8"
selection     = "#1f3a5f"
border        = "#3d444d"
code_bg       = "#151b23"
quote_bar     = "#3d444d"
highlight_bg  = "#bb800966"
ui_background = "#010409"

[palette]
black   = "#2f3742"
red     = "#ff7b72"
green   = "#3fb950"
yellow  = "#d29922"
blue    = "#58a6ff"
magenta = "#bc8cff"
cyan    = "#39c5cf"
white   = "#b1bac4"
bright_black   = "#6e7681"
bright_red     = "#ffa198"
bright_green   = "#56d364"
bright_yellow  = "#e3b341"
bright_blue    = "#79c0ff"
bright_magenta = "#d2a8ff"
bright_cyan    = "#56d4dd"
bright_white   = "#ffffff"

[fonts]
body = { family = "Segoe UI", fallback = ["Inter", "Helvetica Neue", "Arial"] }
mono = { family = "Cascadia Code", fallback = ["Consolas", "SF Mono", "Menlo"] }
ui   = { family = "Segoe UI", fallback = ["Inter", "Helvetica Neue", "Arial"] }

[layout]
measure = 80
font_size = 16
line_height = 1.55
paragraph_spacing = 0.9

[elements.blockquote]
style = "bar"

[elements.hr]
style = "line"

[elements.headings]
numbering = true
h1_rule = true
