# Technical: crisp and cool for documentation. Sans-serif text, a wider
# measure for code-heavy pages, and numbered headings.

[meta]
name = "Technical"
author = "Scrald"
schema = 1
appearance = "light"

[colors]
background    = "#ffffff"
foreground    = "#1f2328"
muted         = "#59636e"
accent        = "#0969da"
link          = "#0969da"
selection     = "#ddf4ff"
border        = "#d1d9e0"
code_bg       = "#f6f8fa"
quote_bar     = "#d1d9e0"
highlight_bg  = "#fff8c5"
ui_background = "#f6f8fa"

[palette]
black   = "#1f2328"
red     = "#cf222e"
green   = "#116329"
yellow  = "#9a6700"
blue    = "#0969da"
magenta = "#8250df"
cyan    = "#1b7c83"
white   = "#d1d9e0"
bright_black   = "#59636e"
bright_red     = "#a40e26"
bright_green   = "#1a7f37"
bright_yellow  = "#bf8700"
bright_blue    = "#218bff"
bright_magenta = "#a475f9"
bright_cyan    = "#3192aa"
bright_white   = "#ffffff"

[fonts]
body = { family = "Segoe UI", fallback = ["Inter", "Helvetica Neue", "Arial"] }
mono = { family = "Cascadia Code", fallback = ["Consolas", "SF Mono", "Menlo"] }
ui   = { family = "Segoe UI", fallback = ["Inter", "Helvetica Neue", "Arial"] }

[layout]
measure = 80
font_size = 16
line_height = 1.55
paragraph_spacing = 0.9

[elements.blockquote]
style = "bar"

[elements.hr]
style = "line"

[elements.headings]
numbering = true
h1_rule = true
