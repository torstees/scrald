name: Bundles

# Builds each platform's installers and keeps them as downloadable artifacts
# (DESIGN.md §11.1, #115): an x86_64 .deb and AppImage, an Apple-silicon
# .app and .dmg (unsigned), and the Windows NSIS installer. It runs by hand
# (Actions > Bundles > Run workflow), after each merge to main, and on pull
# requests that change the packaging, so ordinary PRs don't wait for it.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/bundles.yml
      - crates/scrald-app/tauri*.json
      - crates/scrald-app/linux/**
      - crates/scrald-app/windows/**
      - crates/scrald-app/icons/**

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            files: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage
          - os: macos-latest
            files: |
              target/release/bundle/dmg/*.dmg
          - os: windows-latest
            files: |
              target/release/bundle/nsis/*-setup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev file
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: bundle
      - run: npm ci
      # The bundler's linuxdeploy tool is itself an AppImage, and the runner
      # has no FUSE 2 to mount it, so it unpacks itself instead.
      - run: npm run tauri build
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
      - uses: actions/upload-artifact@v4
        with:
          name: scrald-${{ runner.os }}-${{ runner.arch }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14
