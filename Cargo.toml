[workspace]
resolver = "3"
members = ["crates/scrald-core", "crates/scrald-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/torstees/scrald"

# Shared dependency versions. Member crates opt in with `name.workspace = true`.
[workspace.dependencies]
scrald-core = { path = "crates/scrald-core" }
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
# preserve_order keeps front matter keys in file order (uses indexmap).
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serde-saphyr = "1.3.0"
comrak = { version = "0.56.0", default-features = false }
ammonia = "4.2.1"
imagesize = "0.15.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
insta = { version = "1.49.0", features = ["glob"] }
criterion = "0.8.2"
thiserror = "2.0.21"
tracing = "0.1.44"
notify-debouncer-mini = "0.7.0"
tauri-plugin-opener = "2.7.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Lints shared by every crate (each crate opts in with `[lints] workspace = true`).
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# AGENTS.md: no unwrap() outside tests; use expect("reason") only for true invariants.
unwrap_used = "warn"
# AGENTS.md: log with `tracing`, not println!.
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
